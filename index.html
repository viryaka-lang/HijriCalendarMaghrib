<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hijri Calendar Morocco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="التقويم الهجري للمغرب: تاريخ اليوم، كل شهر مع التاريخ الميلادي، ومواعيد رمضان والأعياد مع نسبة اليقين. Hijri calendar for Morocco.">
<meta name="theme-color" content="#136F55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: header; a green "today" card (moon phase, Hijri date, what tonight brings) beside a countdown to the next occasions;
   the calendar card (year picker + 12-month strip, month header with arrows, day grid of tappable days, selected-day panel)
   beside this month's occasions and a date converter; the year's occasions; footer. One column on phones. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --ink:#13201B; --muted:#56665E; --line:#D9E1DC; --wash:#E9EEEB;
  --accent:#136F55; --accent-ink:#FFFFFF; --accent-soft:#DDEEE6;
  --brass:#8C620E; --brass-soft:#F5E6C2;
  --rmd:#2D4A8A; --rmd-soft:#E6ECF8;
  --red:#C1272D;
  --shadow:0 1px 2px rgba(19,32,27,.05),0 6px 24px -12px rgba(19,32,27,.18);
  --display:"Reem Kufi","Noto Kufi Arabic","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1512; --surface:#141F1B; --ink:#E5EDE9; --muted:#97A9A0; --line:#25342E; --wash:#1B2924;
  --accent:#4FC39C; --accent-ink:#08170F; --accent-soft:#16332A;
  --brass:#E2B550; --brass-soft:#3A2F14; --rmd:#A3B8F0; --rmd-soft:#1B2541; --red:#F06A60;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#141F1B; --ink:#E5EDE9; --muted:#97A9A0; --line:#25342E; --wash:#1B2924;
  --accent:#4FC39C; --accent-ink:#08170F; --accent-soft:#16332A;
  --brass:#E2B550; --brass-soft:#3A2F14; --rmd:#A3B8F0; --rmd-soft:#1B2541; --red:#F06A60;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
#app[lang="ar"]{--display:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px;font-family:var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(22px,3.4vw,30px)}
h2{font-size:clamp(19px,2.6vw,23px)}
h3{font-size:18px}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button,select,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
#app[lang="ar"] .label{letter-spacing:0;text-transform:none;font-size:13.5px}

/* header */
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .sub{color:var(--muted);font-size:14.5px}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14.5px;min-height:38px}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.hero{grid-template-columns:1fr}}
.todaycard{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;align-content:start}
.todaycard .label,.todaycard .muted{color:inherit;opacity:.8}
.todaycard .moon{grid-row:1/5;grid-column:2;width:clamp(76px,13vw,112px);height:auto}
.todaycard .moon .dark{fill:color-mix(in srgb,var(--accent-ink) 14%,transparent)}
.todaycard .moon .lit{fill:var(--accent-ink)}
.bigdate{font-family:var(--display);font-size:clamp(30px,5.2vw,46px);line-height:1.12;font-weight:700}
.greg{font-size:18px;font-weight:500}
.tonight{grid-column:1/-1;border-top:1px solid color-mix(in srgb,var(--accent-ink) 22%,transparent);padding-top:10px;margin-top:4px;font-size:14.5px}
.tonight b{font-weight:600}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .n{font-family:var(--display);font-size:clamp(40px,6vw,56px);font-weight:700;line-height:1;color:var(--accent)}
.count .u{font-size:17px;font-weight:500}
.ev1{display:flex;flex-direction:column;gap:6px}
.ev1 .name{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.3}
.when{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.evs li{border-top:1px solid var(--line)}
.evs button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 4px;border-radius:8px;align-items:center}
.evs button:hover{background:var(--wash)}
.evs button:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.evs .nm{font-weight:600}
.evs .dt{font-size:14px;color:var(--muted);grid-column:1}
.evs .sd{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.exp{background:var(--brass-soft);color:var(--brass)}
.chip.hol{background:var(--brass);color:var(--surface)}
.chip.out{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip.rmd{background:var(--rmd-soft);color:var(--rmd)}
.note{font-size:14px;color:var(--muted)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}

.ybar{display:flex;align-items:center;gap:10px;min-width:0}
.ysel{position:relative;flex:none}
.ysel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--wash);border-radius:10px;padding:7px 30px 7px 12px;font-weight:600;cursor:pointer;min-height:44px}
#app[dir="rtl"] .ysel select{padding:7px 12px 7px 30px}
.ysel::after{content:"";position:absolute;top:50%;inset-inline-end:12px;width:7px;height:7px;border:solid var(--muted);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;min-width:0;flex:1;scrollbar-width:thin}
.strip button{flex:none;scroll-snap-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:92px;text-align:start;position:relative;min-height:44px}
.strip button b{font-weight:600;font-size:13.5px;white-space:nowrap}
.strip button small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.strip button small .p{color:var(--brass);font-weight:600}
.strip button:hover{background:var(--wash)}
.strip button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.strip button[aria-current="true"] small,.strip button[aria-current="true"] small .p{color:inherit;opacity:.85}
.strip button.now::after{content:"";position:absolute;top:6px;inset-inline-end:7px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.strip button.r9:not([aria-current="true"]){background:var(--rmd-soft)}

.mhead{display:flex;align-items:center;gap:10px}
.mhead .mt{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:2px}
.mhead h2{font-size:clamp(23px,3.6vw,30px);font-weight:700}
.mhead .span{color:var(--muted);font-size:14.5px}
.nav{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.nav svg{width:18px;height:18px}
.nav:hover{background:var(--accent-soft);border-color:var(--accent)}
.nav:disabled{opacity:.35;cursor:default;background:var(--surface);border-color:var(--line)}
#app[dir="rtl"] .nav svg{transform:scaleX(-1)}
.mmeta{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;font-size:14px;color:var(--muted)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--ink)}
.pill:hover{background:var(--accent-soft);border-color:var(--accent)}
.banner{font-size:14.5px;padding:10px 14px;border-radius:12px;background:var(--brass-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.banner svg{flex:none;margin-top:4px;color:var(--brass)}
.banner b{color:var(--brass)}

.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow span{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.dow span.fr{color:var(--accent)}
.grid{touch-action:pan-y}
.d{all:unset;box-sizing:border-box;position:relative;min-height:64px;border-radius:12px;background:var(--wash);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border:2px solid transparent;cursor:pointer;color:var(--ink)}
.d.empty{background:transparent;cursor:default}
.d .h{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.d .g{font-size:12px;color:var(--muted);text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d .g.gm{color:var(--ink);font-weight:600}
.d:not(.empty):hover{border-color:var(--line)}
.d.fc{border-style:dashed;border-color:color-mix(in srgb,var(--muted) 35%,transparent)}
.d.rmd{background:var(--rmd-soft)}
.d.rmd .h{color:var(--rmd)}
.d.hol{background:var(--brass-soft)}
.d.hol .h{color:var(--brass)}
.d.obs::after{content:"";position:absolute;top:8px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.d.today{border:2px solid var(--red)}
.d.sel{background:var(--ink);border-color:var(--ink)}
.d.sel .h,.d.sel .g,.d.sel .g.gm{color:var(--surface)}
.d.sel.today{border-color:var(--red)}
.d:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
@media (max-width:480px){.d{min-height:56px;padding:5px 6px;border-radius:9px}.d .h{font-size:18px}.d .g{font-size:10.5px;white-space:normal;line-height:1.15}.dow,.grid{gap:3px}.card{padding:16px}.dow span{font-size:11px}
  .ybar{flex-wrap:wrap}.ysel{flex:1 1 100%}.ysel select{width:100%}.strip{flex-basis:100%}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;position:relative}
.dayinfo{border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.dayinfo .hh{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.3}
.dayinfo .gg{color:var(--muted);font-size:14.5px}
.dayinfo .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.dayinfo .rel{grid-row:1/3;grid-column:2;font-weight:600;color:var(--accent);font-size:14.5px;text-align:end}

.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hlist li{border-top:1px solid var(--line)}
.hlist>li:first-child{border-top:0}
.hbtn{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 4px;border-radius:8px;align-items:center}
.hbtn:hover{background:var(--wash)}
.hbtn:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.hbtn .hn{font-weight:600}
.hbtn .hd{grid-column:1;font-size:14px;color:var(--muted)}
.hbtn .hs{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:13.5px}
.past .hbtn{opacity:.55}
.pub .hn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brass);margin-inline-end:8px;vertical-align:middle}
.empty-note{font-size:14.5px;color:var(--muted)}

.conv{display:flex;flex-direction:column;gap:10px}
.conv input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--wash);width:100%;min-height:44px}
.conv .res{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.3}
.linkbtn{align-self:flex-start;border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.yhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ynav{display:flex;gap:8px;align-items:center}
.ytbl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.ytbl>li:nth-child(2){border-top:0}
@media (max-width:700px){.ytbl{grid-template-columns:1fr}.ytbl>li:nth-child(2){border-top:1px solid var(--line)}}
.ics{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.07)}

footer{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:78ch}
@media (prefers-reduced-motion:no-preference){.d,.nav,.pill,.strip button,.hbtn,.lang button,.evs button{transition:background-color .15s,border-color .15s,color .15s}
  .grid.in{animation:fade .22s ease-out}@keyframes fade{from{opacity:.35}to{opacity:1}}}
</style>

<div class="wrap" id="app" dir="rtl" lang="ar">
  <header class="head">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--accent)"/><path d="M23 9.2a11 11 0 1 0 0 21.6a9 9 0 1 1 0-21.6z" fill="var(--accent-ink)"/><path d="M28.6 15.2l.9 2.6 2.7.1-2.2 1.6.8 2.6-2.2-1.6-2.2 1.6.8-2.6-2.2-1.6 2.7-.1z" fill="var(--accent-ink)"/></svg>
      <div class="t"><h1 id="h1">التقويم الهجري للمغرب</h1><p class="sub" id="sub"></p></div>
    </div>
    <div class="lang" role="group" aria-label="Language / اللغة">
      <button type="button" id="lang-ar" data-l="ar" lang="ar">العربية</button>
      <button type="button" id="lang-fr" data-l="fr" lang="fr">Français</button>
      <button type="button" id="lang-en" data-l="en" lang="en">English</button>
    </div>
  </header>

  <section class="hero">
    <div class="card todaycard" id="today"></div>
    <div class="card" id="next"></div>
  </section>

  <section class="main">
    <div class="card" id="cal">
      <div class="ybar">
        <div class="ysel"><label class="sr" for="ySel" id="ySelL"></label><select id="ySel"></select></div>
        <div class="strip" id="strip"></div>
      </div>
      <div class="mhead">
        <button type="button" class="nav" id="prevM"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="mt"><h2 id="mTitle"></h2><span class="span" id="mSpan"></span></div>
        <button type="button" class="nav" id="nextM"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="mmeta" id="mmeta"></div>
      <div id="banner"></div>
      <div class="dow" id="dow" aria-hidden="true"></div>
      <div class="grid" id="grid" role="group"></div>
      <div class="dayinfo" id="dayinfo" aria-live="polite"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="side">
      <div class="card" id="mhol"></div>
      <div class="card conv">
        <h3 id="convT"></h3>
        <label class="note" for="convIn" id="convH"></label>
        <input type="date" id="convIn">
        <div id="convOut" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <section class="card" id="year"></section>

  <footer id="foot"></footer>

const ALLH = [];

const hChip = h => h.fc ? expChip(h.p) : okChip();

// moon phase drawing (as seen from Morocco: waxing moon lit on the right)
function moonSVG(age, cls) {
  const f = (((age % 29.53) + 29.53) % 29.53) / 29.53, r = 40, c = Math.cos(2*Math.PI*f), rx = Math.abs(c*r).toFixed(2);
  const wax = f < 0.5, so = wax ? 1 : 0, si = wax ? (c > 0 ? 0 : 1) : (c > 0 ? 1 : 0);
  return `<svg class="${cls}" viewBox="0 0 100 100" role="img" aria-label="${esc(T().moon)}"><circle class="dark" cx="50" cy="50" r="${r}"/>
    <path class="lit" d="M50 10 A${r} ${r} 0 0 ${so} 50 90 A${rx} ${r} 0 0 ${si} 50 10Z"/></svg>`;
}

/* ---------- today + coming up ---------- */
function renderToday() {
  const x = T(), m = monthAt(TODAY), el = $('today');
  if (!m) { el.innerHTML = `<span class="label">${x.today}</span><div class="greg">${gdate(TODAY)}</div>`; return; }
  const d = TODAY - m.t0 + 1, tm = monthAt(TODAY+1);
  el.innerHTML = `<span class="label">${x.today}</span>
    ${moonSVG(d + 0.4, 'moon')}
    <div class="bigdate">${d} ${x.hm[m.hm-1]} ${m.hy}</div>
    <div class="greg">${gdate(TODAY)}${m.fc ? ` · ${x.expected} ${bp(pStart(m))}` : ''}</div>
    <div class="muted" style="font-size:14px">${x.dayOf(d, lenSure(m) ? m.len : x.or2930)}</div>
    ${tm ? `<div class="tonight">${x.tonight} <b>${hdate(TODAY+1)}</b>${tm.fc && tm !== m ? ` (${bp(pStart(tm))})` : ''}</div>` : ''}`;
}
let EVS = [];
function renderNext() {

  const [h, ...rest] = EVS, n = h.t - TODAY;
  el.innerHTML = `<span class="label">${x.next}</span>
    <div class="ev1">
      <div class="count">${n === 0 ? `<span class="n">${x.isToday}</span>` : `<span class="n num">${n}</span><span class="u">${x.unit(n)} ${x.until}</span>`}</div>

      <div class="when"><span>${gdate(h.t)}</span>${hChip(h)}${h.pub ? `<span class="chip hol">${x.pub}</span>` : ''}</div>
      ${h.fc && h.alt !== null ? `<p class="note">${x.couldBe(`${gdate(h.alt)} (${bp(h.pa)})`)}</p>` : ''}
    </div>

  el.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => showDay(EVS[+b.dataset.ev].t, true));

let VIEW = (monthAt(TODAY) || (TODAY < FIRST ? M[0] : M[M.length-1])).i;
let SEL = monthAt(TODAY) ? TODAY : M[VIEW].t0;
let YEAR = M[VIEW].hy;
const hashMonth = () => { const mt = /^#m(\d{4})-(\d{1,2})$/.exec(location.hash); return mt ? M.find(m => m.hy === +mt[1] && m.hm === +mt[2]) : null; };
{ const m = hashMonth(); if (m) { VIEW = m.i; SEL = (TODAY >= m.t0 && TODAY < m.t1) ? TODAY : m.t0; YEAR = m.hy; } }

function go(i, sel, focus) {
  i = Math.max(0, Math.min(M.length-1, i)); const m = M[i], changed = i !== VIEW;
  VIEW = i; SEL = sel ?? ((TODAY >= m.t0 && TODAY < m.t1) ? TODAY : m.t0);
  try { history.replaceState(null, '', '#m' + m.hy + '-' + m.hm); } catch(e) {}
  renderCal(changed);
  if (YEAR !== m.hy) { YEAR = m.hy; renderYear(); }
  if (focus) { const b = $('grid').querySelector('.d.sel'); if (b) b.focus({preventScroll:true}); }
}
function showDay(t, scroll) {

}

function renderStrip(smooth) {
  const x = T(), s = $('strip'), cur = monthAt(TODAY);
  s.innerHTML = M.filter(m => m.hy === M[VIEW].hy).map(m => { const [gd, gmo] = gparts(m.t0);

  s.querySelectorAll('button').forEach(b => b.onclick = () => go(+b.dataset.i));

}

$('nextM').onclick = () => go(VIEW+1);
$('ySel').onchange = e => { const y = +e.target.value, cm = M[VIEW].hm; const m = M.find(m => m.hy===y && m.hm===cm) || M.find(m => m.hy===y); go(m.i); };

// keyboard: arrows move the selected day inside the grid; elsewhere, left/right change month
$('grid').addEventListener('keydown', e => {
  const rtl = T().dir === 'rtl', k = e.key, m = M[VIEW];
  const step = {ArrowLeft: rtl?1:-1, ArrowRight: rtl?-1:1, ArrowUp:-7, ArrowDown:7}[k];
  let t = null;
  if (step) t = SEL + step; else if (k === 'Home') t = m.t0; else if (k === 'End') t = m.t1 - 1;
  else if (k === 'PageUp' || k === 'PageDown') { e.preventDefault(); go(VIEW + (k === 'PageUp' ? -1 : 1), undefined, true); return; }
  if (t === null) return;
  e.preventDefault();
  const nm = monthAt(t); if (nm) go(nm.i, t, true);
});
document.addEventListener('keydown', e => {
  if (e.target !== document.body) return;
  const rtl = T().dir === 'rtl';
  if (e.key === 'ArrowLeft') go(VIEW + (rtl?1:-1)); else if (e.key === 'ArrowRight') go(VIEW + (rtl?-1:1));
});
// swipe between months on touch screens
{ let x0 = null, y0 = 0; const g = $('grid');
  g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  g.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5*Math.abs(dy)) { const fwd = T().dir === 'rtl' ? dx > 0 : dx < 0; go(VIEW + (fwd ? 1 : -1)); } }, {passive:true}); }

/* ---------- lists ---------- */
function holItem(h, i) {
  const x = T();
  return `<li class="${h.t<TODAY?'past':''} ${h.pub?'pub':''}"><button type="button" class="hbtn" data-h="${i}">
    <span class="hn">${x.H[h.key]}</span>
    <span class="hd">${gdate(h.t)} · ${h.d} ${x.hm[h.m.hm-1]}</span>
    <span class="hs">${hChip(h)}<span class="muted">${rel(h.t)}</span></span></button></li>`;
}
function bindHol(el, list, scroll) { el.querySelectorAll('[data-h]').forEach(b => b.onclick = () => showDay(list[+b.dataset.h].t, scroll)); }
function renderMonthHol() {
  const x = T(), m = M[VIEW], hs = ALLH.filter(h => h.m === m), el = $('mhol');
  el.innerHTML = `<h3>${x.inMonth}</h3>` + (hs.length ? `<ul class="hlist">${hs.map(holItem).join('')}</ul>` : `<p class="empty-note">${x.none}</p>`);
  bindHol(el, hs, false);
}
function renderYear() {
  const x = T(), hs = ALLH.filter(h => h.m.hy === YEAR && !/2$/.test(h.key)), el = $('year');
  const ms = M.filter(m => m.hy === YEAR), ga = gparts(ms[0].t0)[2], gb = gparts(ms[ms.length-1].t1-1)[2];
  el.innerHTML = `<div class="yhead"><div style="display:flex;flex-direction:column;gap:2px"><h2>${x.yearT(YEAR)}</h2><span class="muted num" style="font-size:14px">${ga===gb?ga:ga+'–'+gb}</span></div>
    <div class="ynav"><button type="button" class="nav" id="prevY" aria-label="${x.prevY}" ${YEAR<=YEARS[0]?'disabled':''}>${$('prevM').innerHTML}</button>
    <button type="button" class="nav" id="nextY" aria-label="${x.nextY}" ${YEAR>=YEARS[YEARS.length-1]?'disabled':''}>${$('nextM').innerHTML}</button></div></div>
    <ul class="ytbl hlist">${hs.map(holItem).join('')}</ul>
    ${CAN_DOWNLOAD ? `<div class="ics"><button type="button" class="btn" id="icsBtn"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4M10 10.5v4M8 12.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>${x.ics(YEAR)}</button><span class="note">${x.icsNote}</span></div>` : ''}`;
  $('prevY').onclick = () => { YEAR--; renderYear(); };
  $('nextY').onclick = () => { YEAR++; renderYear(); };
  bindHol(el, hs, true);
  if ($('icsBtn')) $('icsBtn').onclick = () => downloadICS(YEAR);
}
function downloadICS(y) {
  const x = T(), ymd = t => iso(t).replace(/-/g, '');
  const fold = s => { const out = []; while (s.length > 30) { out.push(s.slice(0, 30)); s = ' ' + s.slice(30); } out.push(s); return out.join('\r\n'); };
  const txt = v => String(v).replace(/[\\;,]/g, c => '\\' + c);
  const ev = ALLH.filter(h => h.m.hy === y).map(h => [
    'BEGIN:VEVENT', `UID:${h.m.hy}-${h.m.hm}-${h.d}-${h.key}@hijri-morocco`, `DTSTAMP:${ymd(TODAY)}T000000Z`,
    `DTSTART;VALUE=DATE:${ymd(h.t)}`, `DTEND;VALUE=DATE:${ymd(h.t+1)}`,
    fold('SUMMARY:' + txt(x.H[h.key] + (h.fc ? ` (${x.expected} ${pct(h.p)})` : ''))),
    fold('DESCRIPTION:' + txt(`${h.d} ${x.hm[h.m.hm-1]} ${h.m.hy} ${x.ah}. ` + (h.fc ? (h.alt !== null ? x.couldBe(`${gdate(h.alt)} (${pct(h.pa)})`) : '') : x.confirmed))),
    'TRANSP:TRANSPARENT', 'END:VEVENT'].join('\r\n'));
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hijri Calendar Morocco//EN', 'CALSCALE:GREGORIAN', fold('X-WR-CALNAME:' + txt(x.yearT(y))), ...ev, 'END:VCALENDAR'].join('\r\n') + '\r\n';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type:'text/calendar;charset=utf-8'}));
  a.download = `hijri-morocco-${y}.ics`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- converter ---------- */
const convIn = $('convIn');
convIn.min = iso(FIRST); convIn.max = iso(LAST);
function renderConv() {
  const x = T(), out = $('convOut');
  $('convT').textContent = x.convT; $('convH').textContent = x.convH;
  if (!convIn.value) { out.innerHTML = ''; return; }
  const t = dn(convIn.value), m = monthAt(t);
  if (!m) { out.innerHTML = `<p class="note">${x.range(gdate(FIRST,{wd:false}), gdate(LAST,{wd:false}))}</p>`; return; }
  const a = altStart(m);
  out.innerHTML = `<div class="muted" style="font-size:14px">${gdate(t)}</div><div class="res">${hdate(t)} ${x.ah}</div>
    <div class="when">${mChip(m)}</div>
    ${m.fc && a!==null ? `<p class="note">${x.couldBe(`${t-a+1} ${x.hm[m.hm-1]} (${bp(pAt(m,a))})`)}</p>` : ''}
    <button type="button" class="linkbtn" id="showIn">${x.show}</button>`;
  $('showIn').onclick = () => showDay(t, true);
}
convIn.addEventListener('input', renderConv);
convIn.value = iso(Math.min(Math.max(TODAY, FIRST), LAST));

/* ---------- language ---------- */
YEARS.forEach(y => { const o = document.createElement('option'); o.value = y; $('ySel').appendChild(o); });
function renderFoot() {
  const x = T(), lastOff = [...M].reverse().find(m => !m.fc);
  $('foot').innerHTML = `<p>${x.foot(hname(lastOff))} ${x.pctNote}</p>
    <p>${x.updated(gdate(dn(D.built),{wd:false}))}${DETAIL ? ` · <a href="${DETAIL}">${x.detail}</a>` : ''}</p>`;
}
function setLang(l) {
  lang = l; const x = T(), app = $('app');
  document.documentElement.lang = l; app.lang = l; app.dir = x.dir;
  $('h1').textContent = x.h1; $('sub').textContent = x.sub; $('ySelL').textContent = x.year;
  [...$('ySel').options].forEach(o => { const ms = M.filter(m => m.hy === +o.value); o.textContent = `${o.value} ${x.ah} · ${gparts(ms[0].t0)[2]}`; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l===l));
  try { localStorage.setItem('hijri-simple-lang', l); } catch(e) {}
  renderToday(); renderNext(); renderCal(false); renderYear(); renderConv(); renderFoot();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.l));
setLang(lang);
</script>

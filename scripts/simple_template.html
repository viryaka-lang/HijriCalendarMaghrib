<style>
/* Layout: a green "today" card and a "next holiday" card side by side; then one big month grid with arrows, beside the month's holidays and a date converter; then the year's holidays as a list. Stacks to one column on phones. */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --ink:#14211C; --muted:#5A6A62; --line:#DAE2DD;
  --accent:#136F55; --accent-ink:#FFFFFF; --accent-soft:#E0EFE8;
  --brass:#8F6410; --brass-soft:#F6E8C6;
  --rmd:#2D4A8A; --rmd-soft:#E8EDF8;
  --red:#C1272D;
  --display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#15201C; --ink:#E6EDE9; --muted:#9AABA3; --line:#27362F;
  --accent:#4FC39C; --accent-ink:#0A1A13; --accent-soft:#173229;
  --brass:#E2B550; --brass-soft:#3A2F14; --rmd:#A3B8F0; --rmd-soft:#1B2541; --red:#F06A60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#15201C; --ink:#E6EDE9; --muted:#9AABA3; --line:#27362F;
  --accent:#4FC39C; --accent-ink:#0A1A13; --accent-soft:#173229;
  --brass:#E2B550; --brass-soft:#3A2F14; --rmd:#A3B8F0; --rmd-soft:#1B2541; --red:#F06A60; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,4.4vw,38px)}
h2{font-size:22px}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
header .t{display:flex;flex-direction:column;gap:6px;min-width:0}
header .sub{color:var(--muted);max-width:60ch}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.top{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
[dir="rtl"] .label{letter-spacing:0;text-transform:none;font-size:14px}
.todaycard{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.todaycard .label,.todaycard .muted{color:inherit;opacity:.82}
.bigdate{font-family:var(--display);font-size:clamp(30px,5.6vw,46px);line-height:1.1;font-weight:600}
.greg{font-size:18px;font-weight:500}
.nextname{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.2}
.when{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.count{font-weight:600;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.exp{background:var(--brass-soft);color:var(--brass)}
.chip.pub{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.note{font-size:14px;color:var(--muted)}

.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}

.mhead{display:flex;align-items:center;gap:10px}
.mhead .mt{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:2px}
.mhead h2{font-size:clamp(22px,3.6vw,28px)}
.mhead .span{color:var(--muted);font-size:14.5px}
.nav{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:22px;line-height:1}
.nav:hover{background:var(--accent-soft)}
.nav:disabled{opacity:.35;cursor:default;background:var(--surface)}
[dir="rtl"] .nav span{display:inline-block;transform:scaleX(-1)}
.mmeta{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;font-size:14px;color:var(--muted)}
.banner{font-size:14.5px;padding:10px 12px;border-radius:10px;background:var(--brass-soft);color:var(--ink)}
.banner b{color:var(--brass)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow span{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding-bottom:2px}
.d{position:relative;min-height:62px;border-radius:10px;background:var(--bg);padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border:2px solid transparent}
.d.empty{background:transparent}
.d .h{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.d .g{font-size:12px;color:var(--muted);text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d .g.gm{color:var(--ink);font-weight:600}
.d.fri{background:color-mix(in srgb,var(--accent-soft) 55%,var(--bg))}
.d.rmd{background:var(--rmd-soft)}
.d.rmd .h{color:var(--rmd)}
.d.hol{background:var(--brass-soft)}
.d.hol .h{color:var(--brass)}
.d.obs::after{content:"";position:absolute;top:8px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.d.today{border-color:var(--red)}
.d.pick{box-shadow:0 0 0 2px var(--accent) inset}
@media (max-width:460px){.d{min-height:52px;padding:4px 5px;border-radius:8px}.d .h{font-size:18px}.d .g{font-size:11px}.dow,.grid{gap:3px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.todaybtn{align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:500}
.todaybtn:hover{background:var(--accent-soft)}

.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.hlist li:first-child{border-top:0;padding-top:2px}
.hlist .hn{font-weight:600}
.hlist .hd{grid-column:1;font-size:14px;color:var(--muted)}
.hlist .hs{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.hlist li.past{opacity:.55}
.hlist li.pub .hn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brass);margin-inline-end:8px;vertical-align:middle}
.empty-note{font-size:14.5px;color:var(--muted)}

.conv{display:flex;flex-direction:column;gap:10px}
.conv input{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);max-width:100%;width:100%}
.conv .res{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.linkbtn{align-self:flex-start;border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.yhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ynav{display:flex;gap:8px;align-items:center}
.ynav .nav{width:38px;height:38px;font-size:19px}
.ytbl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:700px){.ytbl{grid-template-columns:1fr}}
.ytbl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.ytbl li.past{opacity:.55}
.ytbl .hn{font-weight:600}
.ytbl li.pub .hn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brass);margin-inline-end:8px;vertical-align:middle}
.ytbl .hd{grid-column:1;font-size:14px;color:var(--muted)}
.ytbl .hs{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:13.5px}

footer{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:75ch}
@media (prefers-reduced-motion:no-preference){.d,.nav,.todaybtn{transition:background-color .15s}}
</style>

</div>

const dn = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)) / DAY;
const iso = n => new Date(n*DAY).toISOString().slice(0,10);
const now = new Date();
const TODAY = dn(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'));

const M = D.months.map(([hy,hm,s,len,fc,dist]) => ({hy,hm,s,len,fc:!!fc,dist:dist||null,t0:dn(s)}));
M.forEach((m,i) => { m.t1 = m.t0 + m.len; m.i = i; });
const pStart = m => m.fc ? (m.dist[m.s] ?? 0) : 1;
const lenSure = m => { const n = M[m.i+1]; return pStart(m) >= 0.9 && (!n || pStart(n) >= 0.9); };
const altStart = m => { if (!m.fc) return null; const o = Object.entries(m.dist).filter(([d]) => d !== m.s).sort((a,b) => b[1]-a[1]); return o.length && o[0][1] >= 0.1 ? dn(o[0][0]) : null; };
const pct = p => { const v = p*100; return v >= 99.5 ? '>99%' : v < 0.5 ? '<1%' : Math.round(v) + '%'; };
const bp = p => `<bdi dir="ltr" class="num">${pct(p)}</bdi>`;
const pAt = (m, t) => m.fc ? (m.dist[iso(t)] ?? 0) : 1;
const expChip = p => `<span class="chip exp">${T().expected} <b class="num" dir="ltr">${pct(p)}</b></span>`;
const okChip = () => `<span class="chip ok">${T().confirmed}</span>`;
const mChip = m => m.fc ? expChip(pStart(m)) : okChip();
const monthAt = t => M.find(m => t >= m.t0 && t < m.t1);
const FIRST = M[0].t0, LAST = M[M.length-1].t1 - 1;

const HOL = [ // [Hijri month, day, key, public holiday in Morocco]
  [1,1,'newyear',1],[1,10,'ashura',0],[3,12,'mawlid',1],[3,13,'mawlid2',1],[7,27,'isra',0],
  [9,1,'ramadan',0],[10,1,'fitr',1],[10,2,'fitr2',1],[12,9,'arafah',0],[12,10,'adha',1],[12,11,'adha2',1]];

    inMonth:'مناسبات هذا الشهر', none:'لا توجد مناسبات في هذا الشهر.',
    convT:'تحويل تاريخ', convH:'اختر تاريخًا ميلاديًا لمعرفة التاريخ الهجري الموافق له.', show:'عرض في التقويم',
    range:(a,b)=>`اختر تاريخًا بين ${a} و${b}.`,
    yearT:y=>`مناسبات سنة ${y} هـ`, prevY:'السنة السابقة', nextY:'السنة التالية',
    foot:m=>`تتبع بدايات الشهور الإعلانات الرسمية لوزارة الأوقاف والشؤون الإسلامية حتى ${m}. الشهور اللاحقة توقعات مبنية على خرائط رؤية الهلال، وقد يتغير التاريخ المتوقع بيوم واحد. تحقق دائمًا من إعلان الوزارة قبل أي مناسبة.`,
    pctNote:'النسبة المئوية بجانب كل تاريخ متوقع تبيّن درجة اليقين في ذلك التاريخ.',
    detail:'التوقعات المفصلة والأدلة', updated:d=>`آخر تحديث للبيانات: ${d}.`,
    H:{newyear:'رأس السنة الهجرية',ashura:'عاشوراء',mawlid:'عيد المولد النبوي',mawlid2:'عيد المولد النبوي (اليوم الثاني)',isra:'الإسراء والمعراج',
       ramadan:'أول أيام رمضان',fitr:'عيد الفطر',fitr2:'عيد الفطر (اليوم الثاني)',arafah:'يوم عرفة',adha:'عيد الأضحى',adha2:'عيد الأضحى (اليوم الثاني)'}
  }
};
let lang = 'ar';
try { const v = localStorage.getItem('hijri-simple-lang'); if (L[v]) lang = v; } catch(e) {}
const T = () => L[lang];

const wdi = t => (new Date(t*DAY).getUTCDay() + 6) % 7; // 0 = Monday
const gparts = t => { const d = new Date(t*DAY); return [d.getUTCDate(), d.getUTCMonth(), d.getUTCFullYear()]; };
function gdate(t, o={}) { const [d,mo,y] = gparts(t); const x = T();
  return (o.wd===false ? '' : x.wd[wdi(t)] + ' ') + d + ' ' + x.gm[mo] + (o.y===false ? '' : ' ' + y); }
function hdate(t) { const m = monthAt(t); if (!m) return ''; const x = T(); return `${t-m.t0+1} ${x.hm[m.hm-1]} ${m.hy} ${x.ah}`; }
function hname(m) { return `${T().hm[m.hm-1]} ${m.hy}`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// every holiday occurrence across the data
const ALLH = [];
M.forEach(m => HOL.forEach(([hm,d,key,pub]) => { if (m.hm===hm && d<=m.len) {
  const a = altStart(m); ALLH.push({m, d, key, pub, t:m.t0+d-1, alt: a===null ? null : a+d-1, pa: a===null ? 0 : pAt(m, a), fc:m.fc, p:pStart(m)}); } }));

function status(h) {
  return h.fc ? expChip(h.p) : okChip();
}
function rel(t) { const n = t - TODAY; return n >= 0 ? T().inDays(n) : T().ago(-n); }

function renderToday() {
  const x = T(), m = monthAt(TODAY), el = document.getElementById('today');
  if (!m) { el.innerHTML = `<span class="label">${x.today}</span><div class="greg">${gdate(TODAY)}</div>`; return; }
  const d = TODAY - m.t0 + 1;
  el.innerHTML = `<span class="label">${x.today}</span>
    <div class="bigdate">${d} ${x.hm[m.hm-1]} ${m.hy}</div>
    <div class="greg">${gdate(TODAY)}${m.fc ? ' · ' + x.expected + ' <b class="num" dir="ltr">' + pct(pStart(m)) + '</b>' : ''}</div>
    <div class="muted" style="font-size:14px">${x.dayOf(d, lenSure(m) ? m.len : x.or2930)} · ${x.sunset}</div>`;
}
function renderNext() {
  const x = T(), el = document.getElementById('next');
  const h = ALLH.find(h => h.t >= TODAY && h.pub && !/2$/.test(h.key)) || ALLH.find(h => h.t >= TODAY);
  const r = ALLH.find(h => h.key==='ramadan' && h.t >= TODAY);
  if (!h) { el.innerHTML = ''; el.hidden = true; return; }
  const row = (h, big) => `<div class="${big?'nextname':''}" style="${big?'':'font-weight:600'}">${x.H[h.key]}</div>
    <div class="when"><span>${gdate(h.t)}</span>${status(h)}</div>
    <div class="when"><span class="count">${rel(h.t)}</span><span class="muted" style="font-size:14px">${h.d} ${x.hm[h.m.hm-1]} ${h.m.hy}</span></div>
    ${h.fc && h.alt!==null ? `<p class="note">${x.couldBe(`${gdate(h.alt)} (${bp(h.pa)})`)}</p>` : ''}`;
  el.innerHTML = `<span class="label">${x.next}</span>${row(h,true)}`;
  if (r && r !== h) el.innerHTML += `<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:4px">${row(r,false)}</div>`;
}

let VIEW = (monthAt(TODAY) || (TODAY < FIRST ? M[0] : M[M.length-1])).i;
let PICK = null;
function renderCal() {
  const x = T(), m = M[VIEW], el = document.getElementById('cal');
  const end = m.t1 - 1, [, m0, y0] = gparts(m.t0), [, m1, y1] = gparts(end);
  const span = `${gdate(m.t0,{wd:false,y:y0!==y1})} – ${gdate(end,{wd:false})}`;
  const a = altStart(m);
  let h = `<div class="mhead">
      <button type="button" class="nav" id="prevM" aria-label="${x.prev}" ${VIEW===0?'disabled':''}><span>‹</span></button>
      <div class="mt"><h2>${hname(m)} ${x.ah}</h2><span class="span">${span}</span></div>
      <button type="button" class="nav" id="nextM" aria-label="${x.nextM}" ${VIEW===M.length-1?'disabled':''}><span>›</span></button>
    </div>
    <div class="mmeta">${mChip(m)}<span>${lenSure(m) ? x.days(m.len) : x.days2930}</span></div>
    ${m.fc ? `<div class="banner">${x.monthExp(`${gdate(m.t0)} (${bp(pStart(m))})`, a!==null ? `${gdate(a)} (${bp(pAt(m,a))})` : '')}</div>` : ''}
    <div class="dow">${x.ws.map(w=>`<span>${w}</span>`).join('')}</div><div class="grid">`;
  for (let i = 0; i < wdi(m.t0); i++) h += `<div class="d empty" aria-hidden="true"></div>`;
  for (let d = 1; d <= m.len; d++) {
    const t = m.t0 + d - 1, [gd, gmo] = gparts(t), hh = holOf(m.hm, d);
    const cls = ['d']; if (wdi(t)===4) cls.push('fri'); if (m.hm===9) cls.push('rmd');
    if (hh) cls.push(hh[3] ? 'hol' : 'obs'); if (t===TODAY) cls.push('today'); if (t===PICK) cls.push('pick');
    const showM = gd===1 || d===1;
    h += `<div class="${cls.join(' ')}" title="${esc(`${d} ${x.hm[m.hm-1]} ${m.hy} = ${gdate(t)}${m.fc?' · '+x.expected+' '+pct(pStart(m)):''}${hh?' · '+x.H[hh[2]]:''}`)}">
      <span class="h">${d}</span><span class="g${gd===1?' gm':''}">${showM ? gd+' '+x.gs[gmo] : gd}</span></div>`;
  }
  h += `</div><div class="legend">
      <span><i style="border:2px solid var(--red)"></i>${x.lgToday}</span>
      <span><i style="background:var(--brass-soft);box-shadow:inset 0 0 0 1px var(--brass)"></i>${x.lgHol}</span>
      <span><i style="background:var(--bg);position:relative"><b style="position:absolute;top:3px;inset-inline-end:3px;width:6px;height:6px;border-radius:50%;background:var(--brass)"></b></i>${x.lgObs}</span>
      ${m.hm===9?`<span><i style="background:var(--rmd-soft);box-shadow:inset 0 0 0 1px var(--rmd)"></i>${x.lgRmd}</span>`:''}
    </div>`;
  const cur = monthAt(TODAY);
  if (cur && cur.i !== VIEW) h += `<button type="button" class="todaybtn" id="toToday">${x.toToday}</button>`;
  el.innerHTML = h;
  document.getElementById('prevM').onclick = () => go(VIEW-1);
  document.getElementById('nextM').onclick = () => go(VIEW+1);
  const tb = document.getElementById('toToday'); if (tb) tb.onclick = () => { PICK = null; go(cur.i); };
  renderMonthHol();
}
function go(i) { VIEW = Math.max(0, Math.min(M.length-1, i)); renderCal(); if (YEAR !== M[VIEW].hy) { YEAR = M[VIEW].hy; renderYear(); } }
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  const rtl = T().dir==='rtl';
  if (e.key==='ArrowLeft') go(VIEW + (rtl?1:-1)); else if (e.key==='ArrowRight') go(VIEW + (rtl?-1:1));
});

function holItem(h, showYear) {
  const x = T();
  return `<li class="${h.t<TODAY?'past':''} ${h.pub?'pub':''}">
    <span class="hn">${x.H[h.key]}</span>
    <span class="hd">${gdate(h.t)} · ${h.d} ${x.hm[h.m.hm-1]}${showYear?' '+h.m.hy:''}</span>
    <span class="hs">${status(h)}<span class="muted">${rel(h.t)}</span></span></li>`;
}
function renderMonthHol() {
  const x = T(), m = M[VIEW], hs = ALLH.filter(h => h.m === m);
  document.getElementById('mhol').innerHTML = `<h3>${x.inMonth}</h3>` +
    (hs.length ? `<ul class="hlist">${hs.map(h=>holItem(h,false)).join('')}</ul>` : `<p class="empty-note">${x.none}</p>`);
}

let YEAR = M[VIEW].hy;
const YMIN = M[0].hy, YMAX = M[M.length-1].hy;
function renderYear() {
  const x = T(), hs = ALLH.filter(h => h.m.hy === YEAR && !/2$/.test(h.key));
  const el = document.getElementById('year');
  const [, , ga] = gparts(M.find(m=>m.hy===YEAR).t0), [, , gb] = gparts([...M].reverse().find(m=>m.hy===YEAR).t1-1);
  el.innerHTML = `<div class="yhead"><div style="display:flex;flex-direction:column;gap:2px"><h2>${x.yearT(YEAR)}</h2><span class="muted" style="font-size:14px">${ga===gb?ga:ga+'–'+gb}</span></div>
    <div class="ynav"><button type="button" class="nav" id="prevY" aria-label="${x.prevY}" ${YEAR<=YMIN?'disabled':''}><span>‹</span></button>
    <button type="button" class="nav" id="nextY" aria-label="${x.nextY}" ${YEAR>=YMAX?'disabled':''}><span>›</span></button></div></div>
    <ul class="ytbl">${hs.map(h=>holItem(h,false)).join('')}</ul>`;
  document.getElementById('prevY').onclick = () => { YEAR--; renderYear(); };
  document.getElementById('nextY').onclick = () => { YEAR++; renderYear(); };
}

const convIn = document.getElementById('convIn');
convIn.min = iso(FIRST); convIn.max = iso(LAST);
function renderConv() {
  const x = T(), out = document.getElementById('convOut');
  document.getElementById('convT').textContent = x.convT; document.getElementById('convH').textContent = x.convH;
  if (!convIn.value) { out.innerHTML = ''; return; }
  const t = dn(convIn.value), m = monthAt(t);
  if (!m) { out.innerHTML = `<p class="note">${x.range(gdate(FIRST,{wd:false}), gdate(LAST,{wd:false}))}</p>`; return; }
  const a = altStart(m);
  out.innerHTML = `<div class="muted" style="font-size:14px">${gdate(t)}</div><div class="res">${hdate(t)}</div>
    <div class="when">${mChip(m)}</div>
    ${m.fc && a!==null ? `<p class="note">${x.couldBe(`${t-a+1} ${x.hm[m.hm-1]} (${bp(pAt(m,a))})`)}</p>` : ''}
    <button type="button" class="linkbtn" id="showIn">${x.show}</button>`;
  document.getElementById('showIn').onclick = () => { PICK = t; go(m.i); document.getElementById('cal').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); };
}
convIn.addEventListener('input', renderConv);
convIn.value = iso(Math.min(Math.max(TODAY, FIRST), LAST));

function renderFoot() {
  const x = T(), lastOff = [...M].reverse().find(m => !m.fc);
  document.getElementById('foot').innerHTML = `<p>${x.foot(hname(lastOff))} ${x.pctNote}</p>
    <p>${x.updated(gdate(dn(D.built),{wd:false}))}${DETAIL ? ` <a href="${DETAIL}">${x.detail}</a>` : ''}</p>`;
}
function setLang(l) {
  lang = l; const x = T(), app = document.getElementById('app');
  document.documentElement.lang = l; app.dir = x.dir;
  document.getElementById('h1').textContent = x.h1; document.getElementById('sub').textContent = x.sub;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l===l));
  try { localStorage.setItem('hijri-simple-lang', l); } catch(e) {}
  renderToday(); renderNext(); renderCal(); renderYear(); renderConv(); renderFoot();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.l));
setLang(lang);
</script>
